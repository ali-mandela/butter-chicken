<!doctype html>
<html><head><title>Sign In</title></head><body>
<h1>Sign in</h1>
<!-- Deliberately uses data-test, NOT data-testid. Saucedemo and many real apps
     use this convention, and Playwright's get_by_test_id() only ever matches
     data-testid. An earlier clean fixture hid that bug twice: 210 tests green,
     login broken on the first real site. Do not "tidy" these attributes. -->
<form data-test="login-form">
  <input id="user" data-test="username" placeholder="Username">
  <input id="pw" type="password" data-test="password" placeholder="Password" required>
  <button type="submit" data-test="login-button">Log in</button>
</form>
<p><a href="index.html">Home</a></p>
<p><a href="logout.html">Logout</a></p>
</body></html>
