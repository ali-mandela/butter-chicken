[project]
name = "aivar-v2"
version = "0.1.0"
description = "Self-healing QA agent - deterministic core"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.62.0",
    "psycopg[binary]>=3.3.5",
    "streamlit>=1.63.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aivar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: marks tests that call the real LLM API (deselect with '-m \"not live\"')",
]
addopts = "-m 'not live'"
